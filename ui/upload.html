<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>BridgeLab | Subir PBN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <style>
        body { background-color: #051424; color: #d4e4fa; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; display: flex; }
        .main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; }
        .scroll-area { flex: 1; overflow-y: auto; padding: 32px; scroll-behavior: smooth; }
        
        .sidebar-link-active { background: rgba(59,130,246,0.2); color: #60a5fa; font-weight: 900; border-left: 4px solid #3b82f6; }
        
        .upload-card {
            background: rgba(30, 41, 59, 0.4);
            border: 2px dashed rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            height: 300px;
        }
        .upload-card:hover {
            background: rgba(59, 130, 246, 0.05);
            border-color: #3b82f6;
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .upload-card.has-file {
            border-style: solid;
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }
        
        .action-btn {
            background: #3b82f6;
            color: white;
            font-weight: 900;
            padding: 14px 32px;
            border-radius: 16px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.2s;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .action-btn:hover { transform: translateY(-2px); box-shadow: 0 15px 35px rgba(59, 130, 246, 0.4); opacity: 0.9; }
        .action-btn:active { transform: translateY(0) scale(0.95); }
        
        input[type="file"] { display: none; }
    </style>
</head>
<body class="antialiased">
<aside class="w-64 bg-slate-950 border-r border-slate-800 flex flex-col p-6 h-full z-50">
    <h1 class="text-2xl font-black text-white mb-10 tracking-tighter italic text-center">BridgeLab</h1>
    <nav class="space-y-4">
        <a href="/" class="sidebar-link-active flex items-center gap-3 px-4 py-3 rounded-xl transition-all">
            <span class="text-xs font-bold uppercase tracking-widest">Subir PBN</span>
        </a>
        <a href="/analysis" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-900 transition-all opacity-60">
            <span class="text-xs font-bold uppercase tracking-widest">Análisis Mano</span>
        </a>
        <a href="/summary" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-900 transition-all opacity-60">
            <span class="text-xs font-bold uppercase tracking-widest">Resultados</span>
        </a>
    </nav>
</aside>

<main class="main-content">
    <header class="h-16 border-b border-slate-800 px-8 flex items-center justify-between bg-slate-900/80 backdrop-blur-xl z-40">
        <h2 class="text-sm font-black uppercase tracking-[0.3em] text-slate-400">Inyección de Datos del Partido</h2>
        <div id="status-badge" class="flex items-center gap-3 bg-slate-950 px-5 py-2 rounded-2xl border border-slate-800">
            <span class="w-2 h-2 rounded-full bg-slate-500 shadow-[0_0_10px_rgba(148,163,184,0.4)]" id="status-dot"></span>
            <span class="text-[11px] font-black uppercase text-slate-400 tracking-widest" id="status-text">Esperando Archivos...</span>
        </div>
    </header>

    <div class="scroll-area">
        <div class="max-w-4xl mx-auto">
            <div class="mb-12">
                <h3 class="text-4xl font-black text-white tracking-tighter mb-4">Análisis Técnico Pro</h3>
                <p class="text-slate-400 text-lg leading-relaxed">
                    Para iniciar el análisis, BridgeLab requiere los archivos <span class="text-blue-400 font-mono font-bold">abierta.pbn</span> y <span class="text-blue-400 font-mono font-bold">cerrada.pbn</span> del encuentro.
                </p>
            </div>

            <form id="upload-form" class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-16">
                <label class="upload-card group" id="card-abierta">
                    <input type="file" id="file_abierta" name="file_abierta" accept=".pbn" onchange="updateFileName('abierta')">
                    <div class="w-20 h-20 bg-blue-600/10 rounded-full flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                        <svg class="w-10 h-10 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                    </div>
                    <span class="text-xl font-black text-white mb-2" id="title-abierta">abierta.pbn</span>
                    <span class="text-xs font-bold text-slate-500 uppercase tracking-[0.2em]" id="name-abierta">Distribución Sala Abierta</span>
                </label>

                <label class="upload-card group" id="card-cerrada">
                    <input type="file" id="file_cerrada" name="file_cerrada" accept=".pbn" onchange="updateFileName('cerrada')">
                    <div class="w-20 h-20 bg-amber-600/10 rounded-full flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                        <svg class="w-10 h-10 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                    </div>
                    <span class="text-xl font-black text-white mb-2" id="title-cerrada">cerrada.pbn</span>
                    <span class="text-xs font-bold text-slate-500 uppercase tracking-[0.2em]" id="name-cerrada">Distribución Sala Cerrada</span>
                </label>
            </form>

            <div class="flex items-center justify-between bg-slate-900/40 p-8 rounded-[2rem] border border-white/5">
                <div class="flex items-center gap-4 text-slate-500">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    <span class="text-xs font-black uppercase tracking-widest">Procesamiento Local Seguro</span>
                </div>
                <div class="flex gap-6 items-center">
                    <button type="button" onclick="location.reload()" class="text-xs font-black uppercase text-slate-400 hover:text-white transition-colors tracking-widest">Reiniciar</button>
                    <button type="button" onclick="processMatch()" class="action-btn">
                        Procesar Partido
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    function updateFileName(id) {
        const input = document.getElementById('file_' + id);
        const nameLabel = document.getElementById('name-' + id);
        const card = document.getElementById('card-' + id);
        if (input.files && input.files.length > 0) {
            nameLabel.textContent = input.files[0].name;
            nameLabel.className = "text-xs font-black text-blue-400 uppercase tracking-[0.2em]";
            card.classList.add('has-file');
            checkBoth();
        }
    }

    function checkBoth() {
        const fileA = document.getElementById('file_abierta').files[0];
        const fileC = document.getElementById('file_cerrada').files[0];
        if (fileA && fileC) {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            dot.className = "w-2 h-2 rounded-full bg-blue-500 shadow-[0_0_10px_rgba(59,130,246,0.6)]";
            text.textContent = "Archivos Listos";
            text.className = "text-[11px] font-black uppercase text-blue-400 tracking-widest";
        }
    }

    async function processMatch() {
        const fileA = document.getElementById('file_abierta').files[0];
        const fileC = document.getElementById('file_cerrada').files[0];

        if (!fileA || !fileC) {
            alert("Por favor selecciona ambos archivos (.pbn)");
            return;
        }

        const dot = document.getElementById('status-dot');
        const text = document.getElementById('status-text');
        text.textContent = "Procesando...";
        dot.className = "w-2 h-2 rounded-full bg-amber-500 shadow-[0_0_10px_rgba(245,158,11,0.6)] animate-pulse";

        const formData = new FormData();
        formData.append('file_abierta', fileA);
        formData.append('file_cerrada', fileC);

        try {
            const response = await fetch('/upload', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();
            if (response.ok) {
                text.textContent = "¡Éxito!";
                dot.className = "w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.6)]";
                window.location.href = "/summary";
            } else {
                throw new Error(result.message);
            }
        } catch (error) {
            text.textContent = "Error";
            dot.className = "w-2 h-2 rounded-full bg-red-500 shadow-[0_0_10px_rgba(239,68,68,0.6)]";
            alert("Error: " + error.message);
        }
    }
</script>
</body>
</html>
