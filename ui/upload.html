<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-background": "#d4e4fa",
                    "tertiary-fixed-dim": "#dec29a",
                    "outline-variant": "#45464d",
                    "secondary-fixed-dim": "#b9c7e0",
                    "primary-fixed-dim": "#bec6e0",
                    "on-secondary-container": "#abb9d2",
                    "tertiary-container": "#231500",
                    "on-primary-container": "#798098",
                    "inverse-primary": "#565e74",
                    "on-secondary": "#233144",
                    "on-tertiary-container": "#957d5a",
                    "on-tertiary-fixed-variant": "#574425",
                    "surface-container-lowest": "#010f1f",
                    "surface-container": "#122131",
                    "surface": "#051424",
                    "primary": "#bec6e0",
                    "error-container": "#93000a",
                    "surface-container-highest": "#273647",
                    "on-surface": "#d4e4fa",
                    "on-error": "#690005",
                    "on-primary": "#283044",
                    "secondary-fixed": "#d5e3fd",
                    "surface-bright": "#2c3a4c",
                    "primary-container": "#0f172a",
                    "error": "#ffb4ab",
                    "on-surface-variant": "#c6c6cd",
                    "inverse-surface": "#d4e4fa",
                    "secondary": "#b9c7e0",
                    "surface-container-high": "#1c2b3c",
                    "on-tertiary-fixed": "#271901",
                    "primary-fixed": "#dae2fd",
                    "surface-variant": "#273647",
                    "on-secondary-fixed": "#0d1c2f",
                    "tertiary": "#dec29a",
                    "surface-dim": "#051424",
                    "surface-container-low": "#0d1c2d",
                    "tertiary-fixed": "#fcdeb5",
                    "on-tertiary": "#3e2d11",
                    "on-secondary-fixed-variant": "#3a485c",
                    "on-primary-fixed": "#131b2e",
                    "outline": "#909097",
                    "surface-tint": "#bec6e0",
                    "background": "#051424",
                    "on-primary-fixed-variant": "#3f465c",
                    "secondary-container": "#3c4a5e",
                    "inverse-on-surface": "#233143",
                    "on-error-container": "#ffdad6"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "md": "16px",
                    "xs": "4px",
                    "gutter": "12px",
                    "base": "4px",
                    "xl": "32px",
                    "sm": "8px",
                    "lg": "24px"
            },
            "fontFamily": {
                    "display-lg": ["Inter"],
                    "body-md": ["Inter"],
                    "label-xs": ["Inter"],
                    "data-mono": ["Inter"],
                    "title-sm": ["Inter"],
                    "headline-md": ["Inter"]
            },
            "fontSize": {
                    "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "label-xs": ["11px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                    "data-mono": ["13px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "title-sm": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #051424;
            color: #d4e4fa;
        }
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body class="font-body-md text-body-md overflow-hidden">
<!-- SideNavBar Shell -->
<aside class="fixed left-0 top-0 h-full flex flex-col z-50 py-lg docked full-height left-0 w-64 h-screen bg-surface-container border-r border-outline-variant">
<div class="px-md mb-xl">
<div class="flex items-center gap-sm">
<span class="font-title-sm text-title-sm font-bold text-primary tracking-tight">BridgeLab</span>
</div>
<div class="font-label-xs text-label-xs text-on-surface-variant opacity-70">Pro Analytics v2.1</div>
</div>
<nav class="flex-1 flex flex-col">
<a class="flex items-center gap-md px-md py-sm bg-secondary-container text-on-secondary-container border-r-4 border-primary transition-all" href="/">
<span class="material-symbols-outlined" data-icon="upload_file">upload_file</span>
<span class="font-label-xs text-label-xs">PBN Upload</span>
</a>
<a class="flex items-center gap-md px-md py-sm text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-all" href="/analysis">
<span class="material-symbols-outlined" data-icon="query_stats">query_stats</span>
<span class="font-label-xs text-label-xs">Match Analysis</span>
</a>
<a class="flex items-center gap-md px-md py-sm text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-all" href="/summary">
<span class="material-symbols-outlined" data-icon="summarize">summarize</span>
<span class="font-label-xs text-label-xs">Final Reports</span>
</a>
</nav>
</aside>

<main class="ml-64 p-xl flex flex-col min-h-[calc(100vh-64px)]">
<div class="mb-xl grid grid-cols-12 gap-lg">
<div class="col-span-8">
<h1 class="font-headline-md text-headline-md text-primary mb-sm">Match Data Injection</h1>
<p class="text-on-surface-variant max-w-2xl">
                    BridgeLab Pro Analytics requires both <span class="font-data-mono text-data-mono text-tertiary">abierta.pbn</span> and <span class="font-data-mono text-data-mono text-tertiary">cerrada.pbn</span> files.
                </p>
</div>
<div class="col-span-4 flex justify-end items-start">
<div class="bg-surface-container-high p-md border border-outline-variant rounded-xl flex items-start gap-md">
<span class="material-symbols-outlined text-tertiary" data-icon="info">info</span>
<div>
<div class="font-label-xs text-label-xs uppercase tracking-widest text-on-surface-variant">Session Status</div>
<div id="status-text" class="font-data-mono text-data-mono text-on-surface">Awaiting Input...</div>
</div>
</div>
</div>
</div>

<form id="upload-form" class="grid grid-cols-2 gap-lg flex-1">
    <label class="relative group h-full cursor-pointer">
        <input type="file" id="file_abierta" name="file_abierta" accept=".pbn" onchange="updateFileName('abierta')">
        <div id="drop-abierta" class="h-full flex flex-col items-center justify-center border-2 border-dashed border-outline-variant bg-surface-container hover:bg-surface-container-high hover:border-primary transition-all p-xl rounded-xl text-center">
            <div class="w-16 h-16 bg-primary-container flex items-center justify-center rounded-full mb-md group-hover:scale-110 transition-transform">
                <span class="material-symbols-outlined text-primary text-[32px]" data-icon="upload">upload</span>
            </div>
            <h3 class="font-title-sm text-title-sm mb-xs">abierta.pbn</h3>
            <p id="name-abierta" class="text-on-surface-variant font-label-xs text-label-xs uppercase mb-lg">Open Room Distribution</p>
            <div class="px-md py-xs bg-surface-container-low border border-outline-variant rounded-full text-on-surface-variant font-data-mono text-data-mono">
                Click to browse
            </div>
        </div>
    </label>

    <label class="relative group h-full cursor-pointer">
        <input type="file" id="file_cerrada" name="file_cerrada" accept=".pbn" onchange="updateFileName('cerrada')">
        <div id="drop-cerrada" class="h-full flex flex-col items-center justify-center border-2 border-dashed border-outline-variant bg-surface-container hover:bg-surface-container-high hover:border-primary transition-all p-xl rounded-xl text-center">
            <div class="w-16 h-16 bg-secondary-container flex items-center justify-center rounded-full mb-md group-hover:scale-110 transition-transform">
                <span class="material-symbols-outlined text-secondary text-[32px]" data-icon="upload">upload</span>
            </div>
            <h3 class="font-title-sm text-title-sm mb-xs">cerrada.pbn</h3>
            <p id="name-cerrada" class="text-on-surface-variant font-label-xs text-label-xs uppercase mb-lg">Closed Room Distribution</p>
            <div class="px-md py-xs bg-surface-container-low border border-outline-variant rounded-full text-on-surface-variant font-data-mono text-data-mono">
                Click to browse
            </div>
        </div>
    </label>
</form>

<div class="mt-xl py-lg border-t border-outline-variant flex items-center justify-between">
    <div class="flex items-center gap-md text-on-surface-variant text-label-xs uppercase">
        <span class="material-symbols-outlined" data-icon="lock">lock</span>
        <span>Local processing enabled.</span>
    </div>
    <div class="flex gap-md">
        <button type="button" onclick="location.reload()" class="px-lg py-sm font-label-xs text-label-xs uppercase tracking-widest text-on-surface-variant hover:text-on-surface transition-colors">
            Reset
        </button>
        <button type="button" onclick="processMatch()" class="px-xl py-sm bg-primary text-on-primary rounded-lg font-bold text-body-md hover:opacity-90 active:scale-95 transition-all flex items-center gap-sm">
            Process Match
            <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
        </button>
    </div>
</div>
</main>

<script>
    function updateFileName(id) {
        const input = document.getElementById('file_' + id);
        const label = document.getElementById('name-' + id);
        if (input.files && input.files.length > 0) {
            label.textContent = input.files[0].name;
            label.classList.add('text-primary');
        }
    }

    async function processMatch() {
        const fileA = document.getElementById('file_abierta').files[0];
        const fileC = document.getElementById('file_cerrada').files[0];

        if (!fileA || !fileC) {
            alert("Por favor selecciona ambos archivos (.pbn)");
            return;
        }

        const statusText = document.getElementById('status-text');
        statusText.textContent = "Processing...";
        statusText.classList.add('text-tertiary');

        const formData = new FormData();
        formData.append('file_abierta', fileA);
        formData.append('file_cerrada', fileC);

        try {
            const response = await fetch('/upload', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();
            if (response.ok) {
                statusText.textContent = "Success!";
                statusText.classList.replace('text-tertiary', 'text-emerald-500');
                alert(result.message + " (" + result.boards_count + " manos)");
                window.location.href = "/summary";
            } else {
                throw new Error(result.message);
            }
        } catch (error) {
            statusText.textContent = "Error";
            statusText.classList.replace('text-tertiary', 'text-error');
            alert("Error: " + error.message);
        }
    }
</script>
</body></html>
