<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>BridgeLab | Resumen Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <style>
        body { background-color: #051424; color: #d4e4fa; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; display: flex; }
        .main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; }
        .scroll-area { flex: 1; overflow-y: auto; padding: 32px; scroll-behavior: smooth; }
        
        .sidebar-link-active { background: rgba(59,130,246,0.2); color: #60a5fa; font-weight: 900; border-left: 4px solid #3b82f6; }
        
        .team-card {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 24px;
            transition: all 0.2s;
        }
        .team-card:hover { transform: translateY(-4px); background: rgba(30, 41, 59, 0.6); }
        
        .stats-table { width: 100%; border-collapse: separate; border-spacing: 0; }
        .stats-table th { padding: 16px; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; color: #64748b; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .stats-table td { padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.03); }
        
        .badge-imps { background: #3b82f6; color: white; padding: 6px 12px; border-radius: 12px; font-size: 12px; font-weight: 900; }
    </style>
</head>
<body class="antialiased">
<aside class="w-64 bg-slate-950 border-r border-slate-800 flex flex-col p-6 h-full z-50">
    <h1 class="text-2xl font-black text-white mb-10 tracking-tighter italic text-center">BridgeLab</h1>
    <nav class="space-y-4">
        <a href="/" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-900 transition-all opacity-60">
            <span class="text-xs font-bold uppercase tracking-widest">Subir PBN</span>
        </a>
        <a href="/analysis" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-900 transition-all opacity-60">
            <span class="text-xs font-bold uppercase tracking-widest">Análisis Mano</span>
        </a>
        <a href="/summary" class="sidebar-link-active flex items-center gap-3 px-4 py-3 rounded-xl transition-all">
            <span class="text-xs font-bold uppercase tracking-widest">Resultados</span>
        </a>
    </nav>
</aside>

<main class="main-content">
    <header class="h-20 border-b border-slate-800 px-8 flex items-center justify-between bg-slate-900/80 backdrop-blur-xl z-40">
        <h2 class="text-sm font-black uppercase tracking-[0.3em] text-slate-400">Resumen Final del Encuentro</h2>
        <div id="match-status" class="bg-blue-600 px-6 py-2 rounded-2xl shadow-xl shadow-blue-900/20 font-black text-white text-sm italic tracking-tighter">
            Calculando Resultado...
        </div>
    </header>

    <div class="scroll-area">
        <div class="max-w-6xl mx-auto">
            <div id="teams-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-12">
                <!-- Inyectado por JS -->
            </div>

            <div class="bg-slate-900/40 rounded-[2.5rem] border border-white/5 overflow-hidden shadow-2xl">
                <div class="p-8 border-b border-white/5 bg-slate-900/60 flex justify-between items-center">
                    <h3 class="text-2xl font-black text-white tracking-tighter italic">Desempeño por Jugador</h3>
                    <span class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Ordenado por Puntos Técnicos</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="stats-table">
                        <thead>
                            <tr>
                                <th class="text-left">Jugador</th>
                                <th class="text-center">Equipo</th>
                                <th class="text-right">Subasta</th>
                                <th class="text-right">Carteo</th>
                                <th class="text-right">Total Pts</th>
                                <th class="text-right">IMPs Atribuidos</th>
                            </tr>
                        </thead>
                        <tbody id="players-table-body" class="text-sm font-medium">
                            <!-- Inyectado por JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    async function loadData() {
        try {
            const response = await fetch('/api/data');
            const data = await response.json();

            if (!data.active_boards || data.active_boards.length === 0) {
                document.getElementById('match-status').textContent = "No hay datos disponibles.";
                return;
            }

            const summary = data.match_summary;
            const resultText = summary.net > 0 ? `EQUIPO A GANA POR ${summary.net.toFixed(1)} IMPs` : `EQUIPO B GANA POR ${Math.abs(summary.net).toFixed(1)} IMPs`;
            document.getElementById('match-status').textContent = resultText;

            const teamsGrid = document.getElementById('teams-grid');
            teamsGrid.innerHTML = '';
            const tableBody = document.getElementById('players-table-body');
            tableBody.innerHTML = '';

            ['Equipo A', 'Equipo B'].forEach(teamName => {
                const playersInTeamNames = data.teams_roster[teamName];
                const teamPlayers = [];
                
                playersInTeamNames.forEach(pName => {
                    const pd = data.players_data[pName];
                    if (!pd) return;
                    const subasta = Object.values(pd.bidding).reduce((a, b) => a + b, 0);
                    const carteo = Object.values(pd.play).reduce((a, b) => a + b, 0);
                    const imps = Object.values(pd.imps).reduce((a, b) => a + b, 0);
                    teamPlayers.push({ name: pName, team: teamName, subasta, carteo, total_pts: subasta + carteo, total_imps: imps });
                });

                teamPlayers.sort((a, b) => b.total_pts - a.total_pts);
                const teamSub = teamPlayers.reduce((sum, p) => sum + p.subasta, 0);
                const teamCar = teamPlayers.reduce((sum, p) => sum + p.carteo, 0);
                const teamImps = teamPlayers.reduce((sum, p) => sum + p.total_imps, 0);

                teamsGrid.innerHTML += `
                    <div class="team-card">
                        <div class="flex justify-between items-center mb-6">
                            <h4 class="text-3xl font-black text-white italic tracking-tighter">${teamName.toUpperCase()}</h4>
                            <span class="badge-imps">${teamImps.toFixed(1)} IMPs</span>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-slate-950/50 p-4 rounded-xl border border-white/5">
                                <div class="text-[9px] font-black text-slate-500 uppercase mb-1">Total Subasta</div>
                                <div class="text-xl font-mono font-black text-blue-400">${teamSub}</div>
                            </div>
                            <div class="bg-slate-950/50 p-4 rounded-xl border border-white/5">
                                <div class="text-[9px] font-black text-slate-500 uppercase mb-1">Total Carteo</div>
                                <div class="text-xl font-mono font-black text-blue-400">${teamCar}</div>
                            </div>
                        </div>
                    </div>
                `;

                tableBody.innerHTML += `
                    <tr class="bg-blue-600/5">
                        <td colspan="6" class="px-4 py-2 text-[10px] font-black text-blue-400 uppercase tracking-widest">${teamName}</td>
                    </tr>
                `;

                teamPlayers.forEach(p => {
                    tableBody.innerHTML += `
                        <tr class="hover:bg-white/5 transition-colors">
                            <td class="text-white font-black pl-8 py-4">${p.name}</td>
                            <td class="text-center text-slate-500 text-xs font-bold">${p.team}</td>
                            <td class="text-right font-mono ${p.subasta < 0 ? 'text-red-400' : 'text-slate-300'}">${p.subasta}</td>
                            <td class="text-right font-mono ${p.carteo < 0 ? 'text-red-400' : 'text-slate-300'}">${p.carteo}</td>
                            <td class="text-right font-mono text-white font-black text-lg">${p.total_pts}</td>
                            <td class="text-right font-mono font-black text-blue-400 text-lg">${p.total_imps.toFixed(2)}</td>
                        </tr>
                    `;
                });

                tableBody.innerHTML += `
                    <tr class="bg-slate-900/80 font-black">
                        <td colspan="2" class="text-slate-400 text-xs uppercase pl-8 py-4">Subtotal ${teamName}</td>
                        <td class="text-right font-mono text-blue-400">${teamSub}</td>
                        <td class="text-right font-mono text-blue-400">${teamCar}</td>
                        <td class="text-right font-mono text-white text-xl">${teamSub + teamCar}</td>
                        <td class="text-right font-mono text-blue-500 text-xl">${teamImps.toFixed(1)}</td>
                    </tr>
                    <tr><td colspan="6" class="h-6"></td></tr>
                `;
            });
        } catch (error) { console.error("Error:", error); }
    }
    loadData();
</script>
</body>
</html>
